openapi: 3.0.3
info:
  title: Time Deposit API
  version: 1.0.0
tags:
  - name: TimeDeposits
    description: Time deposits and their withdrawals
paths:
  /time-deposits:
    get:
      tags:
        - TimeDeposits
      operationId: getAllTimeDeposits
      summary: Get all time deposits
      description: Returns all time deposits, each with its list of withdrawals.
      responses:
        '200':
          description: All time deposits with their withdrawals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
components:
  schemas:
    TimeDeposit:
      type: object
      required:
        - id
        - planType
        - balance
        - days
        - withdrawals
      properties:
        id:
          type: integer
          description: Unique identifier of the time deposit.
          example: 1
        planType:
          type: string
          description: Plan type that determines the interest rule (basic, student or premium).
          example: basic
        balance:
          type: number
          description: Current balance of the time deposit.
          example: 1000.00
        days:
          type: integer
          description: Number of days since the time deposit was opened.
          example: 31
        withdrawals:
          type: array
          description: Withdrawals made from this time deposit; empty if there are none.
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required:
        - id
        - amount
        - date
      properties:
        id:
          type: integer
          description: Unique identifier of the withdrawal.
          example: 1
        amount:
          type: number
          description: Amount withdrawn.
          example: 100.00
        date:
          type: string
          format: date
          description: Date of the withdrawal.
          example: '2026-01-15'
