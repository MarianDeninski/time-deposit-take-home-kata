spring:
  application:
    name: time-deposit
  datasource:
    url: jdbc:postgresql://localhost:5432/timedeposits
    username: timedeposits
    password: timedeposits
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    # Show the hand-written contract instead of one generated from the code
    url: /openapi/time-deposits.yaml
